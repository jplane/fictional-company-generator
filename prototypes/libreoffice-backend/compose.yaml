services:
  backend:
    build:
      context: .
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
    user: "${POC_UID:-10001}:${POC_GID:-10001}"
    environment:
      CORPUS_ROOT: /corpus
    volumes:
      - type: bind
        source: "${CORPUS_ROOT:-./output}"
        target: /corpus
        bind:
          create_host_path: false
      - type: bind
        source: ../../.github/skills/company-content-generator/scripts/company.py
        target: /app/company_contract.py
        read_only: true
        bind:
          create_host_path: false
    command:
      - python3
      - -m
      - office_backend
      - --canon
      - /corpus/canon.json
      - --plan
      - /corpus/build/plan.json
      - --contexts
      - /corpus/build/contexts
      - --drafts
      - /corpus/build/drafts
      - --root
      - /corpus
